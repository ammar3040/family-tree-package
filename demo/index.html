<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Tree SVG — Interactive Showcase</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
        }
        #tree { width: 100%; height: 100%; }

        /* Modern Professional Glassmorphic Control Panel */
        #control-panel {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 500;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 14px;
            padding: 14px 18px;
            color: #f1f5f9;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 11px;
            max-width: 500px;
            font-size: 11.5px;
            transition: box-shadow 0.2s ease;
        }
        #control-panel:hover {
            box-shadow: 0 24px 48px -15px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(56, 189, 248, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        .cp-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(148, 163, 184, 0.15);
            padding-bottom: 8px;
        }
        .cp-title-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cp-header h1 {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: -0.2px;
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .cp-badge {
            background: rgba(56, 189, 248, 0.12);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 4px;
            padding: 1px 5px;
            font-size: 9.5px;
            font-weight: 600;
            letter-spacing: 0.4px;
        }

        .cp-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .cp-label {
            font-weight: 600;
            color: #94a3b8;
            min-width: 76px;
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .btn-group {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        .c-btn {
            background: rgba(255, 255, 255, 0.05);
            color: #cbd5e1;
            border: 1px solid rgba(148, 163, 184, 0.2);
            padding: 4px 9px;
            border-radius: 6px;
            font-size: 11px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .c-btn:hover {
            background: rgba(56, 189, 248, 0.12);
            border-color: rgba(56, 189, 248, 0.45);
            color: #f8fafc;
            transform: translateY(-1px);
        }
        .c-btn.active {
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            color: #ffffff;
            font-weight: 600;
            border-color: rgba(125, 211, 252, 0.6);
            box-shadow: 0 2px 10px rgba(14, 165, 233, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        .action-btn {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(2, 132, 199, 0.35);
            transition: all 0.18s ease;
        }
        .action-btn:hover {
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            box-shadow: 0 4px 14px rgba(14, 165, 233, 0.5);
            transform: translateY(-1px);
        }

        /* Modern Professional Hover Tooltip */
        #member-tooltip {
            position: fixed;
            display: none;
            pointer-events: none;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.94);
            border: 1px solid rgba(56, 189, 248, 0.35);
            border-radius: 10px;
            padding: 10px 14px;
            color: #f8fafc;
            font-size: 12px;
            box-shadow: 0 16px 36px -8px rgba(0, 0, 0, 0.6), 0 0 15px rgba(56, 189, 248, 0.15);
            backdrop-filter: blur(12px);
            max-width: 280px;
            transform: translate(14px, 14px);
            transition: opacity 0.1s ease;
        }
        #member-tooltip .tt-title {
            font-size: 13.5px;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 3px;
            letter-spacing: -0.2px;
        }
        #member-tooltip .tt-relation {
            font-size: 12px;
            font-weight: 500;
            color: #e2e8f0;
            margin-bottom: 2px;
        }
        #member-tooltip .tt-meta {
            font-size: 10px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-top: 4px;
        }

        /* Professional Modal for Relationship Roster */
        #relations-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.75);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }
        #relations-modal.open { display: flex; }
        .modal-box {
            background: #0f172a;
            border: 1px solid rgba(56, 189, 248, 0.35);
            border-radius: 16px;
            padding: 22px 26px;
            max-width: 740px;
            width: 90vw;
            max-height: 85vh;
            overflow-y: auto;
            color: #f1f5f9;
            box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.7), 0 0 30px rgba(56, 189, 248, 0.15);
        }
        .modal-box h2 {
            color: #f8fafc;
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(148, 163, 184, 0.15);
            padding-bottom: 10px;
        }
        .roster-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11.5px;
            margin-top: 10px;
        }
        .roster-table th {
            text-align: left;
            padding: 9px 12px;
            background: rgba(56, 189, 248, 0.08);
            color: #38bdf8;
            border-bottom: 1.5px solid rgba(56, 189, 248, 0.3);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 10.5px;
        }
        .roster-table td {
            padding: 8px 12px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
            color: #cbd5e1;
        }
        .roster-table tr:hover {
            background: rgba(56, 189, 248, 0.06);
        }
    </style>

    <div id="control-panel">
        <div class="cp-header">
            <div class="cp-title-wrap">
                <h1>FamilyTreeSVG</h1>
                <span class="cp-badge">Pro v1.1.1</span>
            </div>
            <div style="display:flex; gap:6px;">
                <button class="action-btn" onclick="toggleRelationsModal(true)">Roster</button>
                <button class="action-btn" onclick="tree.fitView(true)">Fit View</button>
                <button class="action-btn" onclick="tree.exportSVG()">Export</button>
            </div>
        </div>

        <!-- Family Dataset Selection -->
        <div class="cp-row">
            <span class="cp-label">Dataset:</span>
            <div class="btn-group" id="bg-dataset">
                <button class="c-btn active" onclick="setDataset('balanced', this)">Balanced Tree (Symmetric)</button>
                <button class="c-btn" onclick="setDataset('khan50', this)">50-Person Canopy</button>
            </div>
        </div>

        <!-- Branch Styles -->
        <div class="cp-row">
            <span class="cp-label">Branch:</span>
            <div class="btn-group" id="bg-branch">
                <button class="c-btn active" onclick="setBranch('woodcut', this)">Woodcut Sap</button>
                <button class="c-btn" onclick="setBranch('gnarled', this)">Gnarled Rustic</button>
                <button class="c-btn" onclick="setBranch('classic', this)">Classic Smooth</button>
                <button class="c-btn" onclick="setBranch('willow_tendril', this)">Flowing Willow</button>
                <button class="c-btn" onclick="setBranch('zen_bonsai', this)">Faceted Zen</button>
            </div>
        </div>

        <!-- Trunk Styles -->
        <div class="cp-row">
            <span class="cp-label">Trunk:</span>
            <div class="btn-group" id="bg-trunk">
                <button class="c-btn active" onclick="setTrunk('calligraphic', this)">Elegant S-Curve</button>
                <button class="c-btn" onclick="setTrunk('gnarled_veteran', this)">Gnarled Veteran</button>
                <button class="c-btn" onclick="setTrunk('banyan_cathedral', this)">Cathedral Banyan</button>
                <button class="c-btn" onclick="setTrunk('dragon_bonsai', this)">Dragon Bonsai</button>
            </div>
        </div>

        <!-- Leaf Shapes -->
        <div class="cp-row">
            <span class="cp-label">Leaf:</span>
            <div class="btn-group" id="bg-leaf">
                <button class="c-btn" onclick="setLeaf('laurel', this)">Laurel</button>
                <button class="c-btn" onclick="setLeaf('oval', this)">Oval</button>
                <button class="c-btn" onclick="setLeaf('oak', this)">Oak</button>
                <button class="c-btn" onclick="setLeaf('ginkgo', this)">Ginkgo</button>
                <button class="c-btn" onclick="setLeaf('maple', this)">Maple</button>
                <button class="c-btn active" onclick="setLeaf('birch', this)">Birch</button>
                <button class="c-btn" onclick="setLeaf('linden', this)">Linden</button>
            </div>
        </div>

        <!-- Leaf Render Mode -->
        <div class="cp-row">
            <span class="cp-label">Mode:</span>
            <div class="btn-group" id="bg-mode">
                <button class="c-btn active" onclick="setMode('svg', this)">Pure Vector SVG</button>
                <button class="c-btn" onclick="setMode('png', this)">Textured PNG</button>
            </div>
        </div>

        <!-- Color Themes -->
        <div class="cp-row">
            <span class="cp-label">Palette:</span>
            <div class="btn-group" id="bg-colors">
                <button class="c-btn active" onclick="setTheme('#17361a','#3a1f13','#2d1607', this)">Emerald</button>
                <button class="c-btn" onclick="setTheme('#dfa467','#4d2b1a','#3d1d11', this)">Autumn</button>
                <button class="c-btn" onclick="setTheme('#a35c6a','#5e3b25','#4a2c16', this)">Cherry</button>
                <button class="c-btn" onclick="setTheme('#2a6b5c','#2d3e50','#1f2937', this)">Pine</button>
                <button class="c-btn" onclick="setTheme('#d67b45','#4d2b1a','#2d1607', this)">Sunset</button>
            </div>
        </div>
    </div>

    <!-- Interactive Floating Member Tooltip -->
    <div id="member-tooltip">
        <div class="tt-title" id="tt-name">Name</div>
        <div class="tt-relation" id="tt-relation">Relation</div>
        <div class="tt-meta" id="tt-gen">Generation</div>
    </div>

    <!-- Full Relationship Modal Table -->
    <div id="relations-modal" onclick="if (event.target === this) toggleRelationsModal(false)">
        <div class="modal-box">
            <h2>
                <span>Genealogical Relationship Roster</span>
                <button class="c-btn" onclick="toggleRelationsModal(false)">✕ Close</button>
            </h2>
            <p style="font-size:12px; color:#94a3b8; margin-bottom:14px;">
                Hover over any leaf on the canvas to inspect real-time relations, or refer to the roster below:
            </p>
            <table class="roster-table">
                <thead>
                    <tr>
                        <th>Member Name</th>
                        <th>Genealogical Relationship</th>
                        <th>Branch Lineage</th>
                        <th>Generation</th>
                    </tr>
                </thead>
                <tbody id="roster-body"></tbody>
            </table>
        </div>
    </div>

    <div id="tree"></div>

        var initTrunk = 'calligraphic';
        var initLeaf = 'birch';
        var initMode = 'svg';

        try {
            var urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('dataset')) initDataset = urlParams.get('dataset');
            if (urlParams.get('branch')) initBranch = urlParams.get('branch');
            if (urlParams.get('trunk')) initTrunk = urlParams.get('trunk');
            if (urlParams.get('leaf')) initLeaf = urlParams.get('leaf');
            if (urlParams.get('mode')) initMode = urlParams.get('mode');
        } catch (e) {}

        var initialData = (initDataset === 'khan50') ? khan50FamilyData : balancedFamilyData;

        // Initialize with default balanced tree
        var tree = FamilyTreeSVG.create('#tree', initialData, {
            leafColor: '#1a4823',
            branchColor: '#3a1f13',
            trunkColor: '#2d1607',
            branchStyle: initBranch,
            trunkStyle: initTrunk,
            leafStyle: initLeaf,
            leafRenderMode: initMode,
            leafPngUrls: {
                laurel: '../assets/leaf_laurel.png',
                oval: '../assets/leaf_oval.png',
                oak: '../assets/leaf_oak.png',
                ginkgo: '../assets/leaf_ginkgo.png',
                maple: '../assets/leaf_maple.png',
                birch: '../assets/leaf_birch.png',
                linden: '../assets/leaf_linden.png'
            }
        });

        // Sync active button states with initial configuration
        if (initDataset !== 'balanced') {
            document.querySelectorAll('#bg-dataset .c-btn').forEach(function(b) {
                b.classList.toggle('active', b.getAttribute('onclick').indexOf("'" + initDataset + "'") !== -1);
            });
        }
        if (initBranch !== 'woodcut') {
            document.querySelectorAll('#bg-branch .c-btn').forEach(function(b) {
                b.classList.toggle('active', b.getAttribute('onclick').indexOf("'" + initBranch + "'") !== -1);
            });
        }
        if (initTrunk !== 'calligraphic') {
            document.querySelectorAll('#bg-trunk .c-btn').forEach(function(b) {
                b.classList.toggle('active', b.getAttribute('onclick').indexOf("'" + initTrunk + "'") !== -1);
            });
        }
        if (initLeaf !== 'birch') {
            document.querySelectorAll('#bg-leaf .c-btn').forEach(function(b) {
                b.classList.toggle('active', b.getAttribute('onclick').indexOf("'" + initLeaf + "'") !== -1);
            });
        }
        if (initMode !== 'svg') {
            document.querySelectorAll('#bg-mode .c-btn').forEach(function(b) {
                b.classList.toggle('active', b.getAttribute('onclick').indexOf("'" + initMode + "'") !== -1);
            });
        }

        // Populate the roster table with professional colors
        function populateRoster() {
            var body = document.getElementById('roster-body');
            if (!body) return;
            body.innerHTML = '';
            var items = [];
            function collect(n, lineage) {
                var name = n.name || n.full_name || 'Unknown';
                var rel = n.relation || (n._isPartner ? 'Partner / In-Law' : 'Family Descendant');
                var gen = (n._gen !== undefined ? n._gen + 1 : 1);
                items.push({ name: name, rel: rel, lineage: lineage, gen: gen });
                if (n.children) {
                    n.children.forEach(function(c) {
                        collect(c, n._isPartner ? lineage : name);
                    });
                }
            }
            if (tree && tree._ROOT) collect(tree._ROOT, 'Patriarchal Trunk');
            items.forEach(function(item) {
                var tr = document.createElement('tr');
                tr.innerHTML = '<td style="font-weight:600; color:#f8fafc;">' + item.name + '</td>' +
                             '<td style="color:#38bdf8; font-weight:500;">' + item.rel + '</td>' +
                             '<td style="color:#94a3b8;">' + item.lineage + '</td>' +
                             '<td><span style="background:rgba(148,163,184,0.15); color:#cbd5e1; padding:2px 7px; border-radius:10px; font-size:10px;">Gen ' + item.gen + '</span></td>';
                body.appendChild(tr);
            });
        }
        setTimeout(populateRoster, 300);

        function toggleRelationsModal(open) {
            var m = document.getElementById('relations-modal');
            if (open) {
                populateRoster();
                m.classList.add('open');
            } else {
                m.classList.remove('open');
            }
        }

        // Hover Tooltip logic
        var tt = document.getElementById('member-tooltip');
        var ttName = document.getElementById('tt-name');
        var ttRel = document.getElementById('tt-relation');
        var ttGen = document.getElementById('tt-gen');

        document.getElementById('tree').addEventListener('mousemove', function(e) {
            var g = e.target.closest('g[data-id]');
            if (g && tree && tree._nodeMap) {
                var nid = g.getAttribute('data-id');
                var node = tree._nodeMap[nid];
                if (node) {
                    ttName.textContent = node.name || node.full_name || 'Family Member';
                    ttRel.textContent = node.relation || (node._isPartner ? 'Partner / In-Law' : 'Descendant');
                    var genNum = (node._gen !== undefined ? node._gen + 1 : 1);
                    var genLabel = genNum === 1 ? '1st Generation (Root)' :
                                   genNum === 2 ? '2nd Generation (Children)' :
                                   genNum === 3 ? '3rd Generation (Grandchildren)' :
                                   genNum === 4 ? '4th Generation (Great-Grandchildren)' :
                                   ('Generation ' + genNum);
                    ttGen.textContent = genLabel;
                    tt.style.display = 'block';
                    tt.style.left = (e.clientX + 14) + 'px';
                    tt.style.top = (e.clientY + 14) + 'px';
                    return;
                }
            }
            tt.style.display = 'none';
        });

        document.getElementById('tree').addEventListener('mouseleave', function() {
            tt.style.display = 'none';
        });

        function setDataset(type, btn) {
            var data = (type === 'khan50') ? khan50FamilyData : balancedFamilyData;
            tree.loadData(data);
            setActiveBtn('#bg-dataset', btn);
            setTimeout(populateRoster, 200);
        }

        function setBranch(style, btn) {
            tree.setBranchStyle(style);
            setActiveBtn('#bg-branch', btn);
        }

        function setTrunk(style, btn) {
            tree.setTrunkStyle(style);
            setActiveBtn('#bg-trunk', btn);
        }

        function setLeaf(style, btn) {
            tree.setLeafStyle(style);
            setActiveBtn('#bg-leaf', btn);
        }

        function setMode(mode, btn) {
            tree.setLeafRenderMode(mode);
            setActiveBtn('#bg-mode', btn);
        }

        function setTheme(l, b, t, btn) {
            tree.setColors(l, b, t);
            setActiveBtn('#bg-colors', btn);
        }

        function setActiveBtn(groupSel, activeBtn) {
            document.querySelectorAll(groupSel + ' .c-btn').forEach(function(b) {
                b.classList.toggle('active', b === activeBtn);
            });
        }
    </script>
</body>
</html>
